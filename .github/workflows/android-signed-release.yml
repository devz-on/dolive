
name: Android Signed Release

on:
  push:
    branches:
      - main
      - master
      - work

  workflow_dispatch:

# Prevent two builds from trying to create the same release version.
concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  build-signed-release:
    runs-on: ubuntu-latest

    # Required so GITHUB_TOKEN can create tags/releases.
    permissions:
      contents: write

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ---------------------------------------------------------
      # Gradle
      #
      # IMPORTANT:
      # Gradle 9.6 currently breaks the AGP version used by
      # this project, so Gradle is explicitly pinned to 9.5.0.
      # ---------------------------------------------------------
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ---------------------------------------------------------
      # Verify signing secrets
      # ---------------------------------------------------------
      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD is missing"
            exit 1
          fi

          echo "All Android signing secrets are present."

      # ---------------------------------------------------------
      # Decode keystore
      # ---------------------------------------------------------
      - name: Decode release keystore
        shell: bash
        run: |
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"

          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ANDROID_KEYSTORE_PATH"

          if [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore successfully decoded."

      # ---------------------------------------------------------
      # Show build environment
      # ---------------------------------------------------------
      - name: Show build versions
        run: |
          java -version
          gradle --version
          sdkmanager --version

      # ---------------------------------------------------------
      # Tests + lint
      # ---------------------------------------------------------
      - name: Run tests and lint
        run: |
          gradle --no-daemon clean test lint

      # ---------------------------------------------------------
      # Build signed release APK
      # ---------------------------------------------------------
      - name: Build signed release APK
        run: |
          gradle --no-daemon assembleRelease

      # ---------------------------------------------------------
      # Verify APK exists
      # ---------------------------------------------------------
      - name: Verify release APK
        shell: bash
        run: |
          echo "Searching for release APK..."

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No release APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      # ---------------------------------------------------------
      # Determine next GitHub Release tag
      #
      # Examples:
      #
      # No previous release -> v1.0.0
      # v1.0.0             -> v1.0.1
      # v1.0.1             -> v1.0.2
      # v1.0.9             -> v1.0.10
      # v1.2.99            -> v1.2.100
      # v2.5.12            -> v2.5.13
      # ---------------------------------------------------------
      - name: Determine next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Checking latest GitHub Release..."

          LATEST_TAG="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/dev/null || true
          )"

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous GitHub Release found."
            NEXT_TAG="v1.0.0"
          else
            echo "Latest GitHub Release: $LATEST_TAG"

            # Remove leading "v" if present.
            VERSION="${LATEST_TAG#v}"

            # Require MAJOR.MINOR.PATCH format.
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest release tag '$LATEST_TAG' does not match vMAJOR.MINOR.PATCH format."
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            # Increment patch number.
            PATCH=$((PATCH + 1))

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Next GitHub Release: $NEXT_TAG"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Rename/copy APK to cleaner release filename
      # ---------------------------------------------------------
      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          APK_FILE="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK was found."
            exit 1
          fi

          RELEASE_APK="screencaster-${TAG}.apk"

          echo "Source APK:"
          echo "$APK_FILE"

          echo "Creating:"
          echo "$RELEASE_APK"

          cp "$APK_FILE" "$RELEASE_APK"

          if [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Failed to prepare release APK."
            exit 1
          fi

          echo "path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "name=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Show release information
      # ---------------------------------------------------------
      - name: Show release information
        run: |
          echo "Release tag: ${{ steps.version.outputs.tag }}"
          echo "APK: ${{ steps.apk.outputs.path }}"
          ls -lh "${{ steps.apk.outputs.path }}"

      # ---------------------------------------------------------
      # Upload APK to GitHub Actions artifacts
      #
      # This is separate from GitHub Releases and allows
      # downloading directly from the workflow run.
      # ---------------------------------------------------------
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screencaster-${{ steps.version.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Create GitHub Release
      #
      # Creates:
      #   - Git tag
      #   - GitHub Release
      #   - Automatic release notes
      #   - APK attachment
      # ---------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          echo "Creating GitHub Release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

          echo ""
          echo "========================================"
          echo "GitHub Release created successfully"
          echo "========================================"
          echo "Version: $RELEASE_TAG"
          echo "APK:     $APK_PATH"

      # ---------------------------------------------------------
      # Cleanup sensitive keystore
      # ---------------------------------------------------------
      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: |
          if [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
            echo "Temporary decoded keystore removed."
        
