name: Android signed release

on:
  push:
    branches:
      - main
      - master
      - work

  workflow_dispatch:

# Prevent multiple release jobs from choosing the same version
# if several pushes happen at nearly the same time
concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  build-signed-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Verify signing secrets
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode release keystore
        run: |
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ANDROID_KEYSTORE_PATH"

          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Run tests and lint
        run: |
          gradle --no-daemon clean test lint

      - name: Build signed release APK
        run: |
          gradle --no-daemon assembleRelease

      # ---------------------------------------------------------
      # Determine next GitHub Release version
      #
      # No release  -> v1.0.0
      # v1.0.0      -> v1.0.1
      # v1.0.9      -> v1.0.10
      # v2.5.12     -> v2.5.13
      # ---------------------------------------------------------
      - name: Determine next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Checking latest GitHub release..."

          LATEST_TAG="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/dev/null || true
          )"

          echo "Latest release tag: ${LATEST_TAG:-none}"

          if [ -z "$LATEST_TAG" ]; then

            NEXT_TAG="v1.0.0"

          else

            # Remove leading "v"
            VERSION="${LATEST_TAG#v}"

            # Validate semantic version format
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest release tag '$LATEST_TAG' is not in vMAJOR.MINOR.PATCH format."
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            PATCH=$((PATCH + 1))

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          fi

          echo "Next release tag: $NEXT_TAG"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      # Give the APK a nicer release filename.
      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          APK_FILE="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK was found."
            exit 1
          fi

          RELEASE_APK="screencaster-${TAG}.apk"

          cp "$APK_FILE" "$RELEASE_APK"

          echo "Original APK: $APK_FILE"
          echo "Release APK:  $RELEASE_APK"

          echo "path=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # Keep the APK available from the Actions run too.
      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screencaster-${{ steps.version.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Create the GitHub tag + GitHub Release + attach APK.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          echo "Creating GitHub Release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

          echo "Successfully released $RELEASE_TAG"