name: Android signed release

on:
  push:
    branches: [ main, master, work ]
  pull_request:
  workflow_dispatch:
#fefe
jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Verify signing secrets
        run: |
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Run tests and lint
        run: gradle --no-daemon clean test lint

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: screencaster-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
